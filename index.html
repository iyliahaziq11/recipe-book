<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Recipe Book 🍳</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #ffe066;
    --coral: #ff6b6b;
    --mint: #b5ead7;
    --pink: #ffb3c6;
    --sky: #a0d8ef;
    --purple: #c9b8f5;
    --orange: #ffbe76;
    --ink: #1a1a2e;
    --bg: #fffdf5;
    --card-bg: #fff9f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: 'Nunito', sans-serif;
background: var(--bg);
color: var(--ink);
min-height: 100vh;
}

header {
background: var(--yellow);
border-bottom: 3px solid var(--ink);
padding: 2rem 2rem 1.5rem;
position: relative;
overflow: hidden;
}
header::before {
content: '';
position: absolute;
top: -30px; right: -30px;
width: 120px; height: 120px;
background: var(--coral);
border-radius: 50%;
border: 3px solid var(--ink);
}
header::after {
content: '';
position: absolute;
bottom: -20px; left: 40%;
width: 80px; height: 80px;
background: var(--mint);
border-radius: 50%;
border: 3px solid var(--ink);
}
.header-inner { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
.header-title {
font-family: 'Fredoka One', cursive;
font-size: clamp(2.2rem, 6vw, 3.5rem);
color: var(--ink);
line-height: 1.1;
}
.header-title span { color: var(--coral); }
.header-sub {
font-size: 1rem;
font-weight: 600;
color: #555;
margin-top: 6px;
}
.header-actions {
display: flex;
gap: 10px;
flex-wrap: wrap;
margin-top: 1.25rem;
}
.btn {
display: inline-flex;
align-items: center;
gap: 6px;
padding: 10px 20px;
border-radius: 30px;
border: 2.5px solid var(--ink);
font-family: 'Nunito', sans-serif;
font-weight: 800;
font-size: 0.9rem;
cursor: pointer;
transition: transform 0.1s, box-shadow 0.1s;
text-decoration: none;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--coral); color: #fff; box-shadow: 3px 3px 0 var(--ink); }
.btn-primary:hover { box-shadow: 5px 5px 0 var(--ink); transform: translate(-1px,-1px); }
.btn-secondary { background: #fff; color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.btn-secondary:hover { box-shadow: 5px 5px 0 var(--ink); transform: translate(-1px,-1px); }

.toolbar {
background: #fff;
border-bottom: 2.5px solid var(--ink);
padding: 1rem 2rem;
position: sticky;
top: 0;
z-index: 100;
}
.toolbar-inner {
max-width: 900px;
margin: 0 auto;
display: flex;
gap: 12px;
flex-wrap: wrap;
align-items: center;
}
.search-box {
flex: 1;
min-width: 180px;
display: flex;
align-items: center;
gap: 8px;
background: var(--bg);
border: 2.5px solid var(--ink);
border-radius: 30px;
padding: 8px 16px;
}
.search-box input {
border: none;
background: transparent;
font-family: 'Nunito', sans-serif;
font-size: 0.95rem;
font-weight: 600;
color: var(--ink);
outline: none;
width: 100%;
}
.filter-chips {
display: flex;
gap: 8px;
flex-wrap: wrap;
}
.chip {
padding: 6px 14px;
border-radius: 30px;
border: 2.5px solid var(--ink);
font-family: 'Nunito', sans-serif;
font-weight: 700;
font-size: 0.8rem;
cursor: pointer;
background: #fff;
transition: background 0.15s, transform 0.1s;
white-space: nowrap;
}
.chip.active, .chip:hover { background: var(--yellow); transform: translateY(-1px); }

main {
max-width: 900px;
margin: 0 auto;
padding: 2rem;
}
.section-header {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 1.25rem;
}
.section-title {
font-family: 'Fredoka One', cursive;
font-size: 1.5rem;
color: var(--ink);
}
.count-badge {
background: var(--coral);
color: #fff;
font-weight: 800;
font-size: 0.75rem;
padding: 3px 10px;
border-radius: 30px;
border: 2px solid var(--ink);
}

.recipe-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
gap: 1.25rem;
margin-bottom: 3rem;
}

.recipe-card {
background: var(--card-bg);
border: 2.5px solid var(--ink);
border-radius: 18px;
overflow: hidden;
cursor: pointer;
transition: transform 0.15s, box-shadow 0.15s;
position: relative;
box-shadow: 4px 4px 0 var(--ink);
}
.recipe-card:hover {
transform: translate(-2px,-3px);
box-shadow: 6px 7px 0 var(--ink);
}
.card-emoji-wrap {
font-size: 3rem;
text-align: center;
padding: 1.25rem 1rem 0.75rem;
position: relative;
}
.card-source-badge {
position: absolute;
top: 10px;
right: 10px;
font-size: 0.65rem;
font-weight: 800;
text-transform: uppercase;
letter-spacing: 0.05em;
padding: 3px 9px;
border-radius: 20px;
border: 2px solid var(--ink);
}
.source-mum    { background: var(--pink); }
.source-web    { background: var(--sky); }
.source-tiktok { background: var(--purple); }
.source-own    { background: var(--mint); }

.card-body { padding: 0.75rem 1rem 1rem; }
.card-title {
font-family: 'Fredoka One', cursive;
font-size: 1.15rem;
color: var(--ink);
line-height: 1.2;
margin-bottom: 4px;
}
.card-tags {
display: flex;
gap: 5px;
flex-wrap: wrap;
margin: 6px 0;
}
.card-tag {
font-size: 0.7rem;
font-weight: 700;
padding: 3px 9px;
border-radius: 20px;
border: 2px solid var(--ink);
}
.card-meta {
display: flex;
gap: 10px;
margin-top: 8px;
font-size: 0.78rem;
font-weight: 600;
color: #555;
}
.card-fav {
position: absolute;
bottom: 10px;
right: 10px;
font-size: 1.1rem;
cursor: pointer;
transition: transform 0.2s;
}
.card-fav:hover { transform: scale(1.3); }

.view-label {
font-weight: 800;
font-size: 0.8rem;
color: #555;
display: flex;
align-items: center;
margin-right: 2px;
}

.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); flex-shrink: 0; }

.recipe-grid.view-rows { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.recipe-grid.view-tiles { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }

.row-card {
display: flex;
align-items: center;
gap: 8px;
background: var(--card-bg);
border: 2px solid var(--ink);
border-radius: 14px;
padding: 8px 12px;
cursor: pointer;
box-shadow: 2px 2px 0 var(--ink);
transition: transform 0.1s, box-shadow 0.1s;
}
.row-card:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
.row-emoji { font-size: 1.3rem; flex-shrink: 0; }
.row-name {
font-family: 'Nunito', sans-serif;
font-weight: 800;
font-size: 0.85rem;
flex: 1;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.tile-card {
background: var(--card-bg);
border: 2px solid var(--ink);
border-radius: 16px;
padding: 10px 6px 8px;
text-align: center;
position: relative;
cursor: pointer;
box-shadow: 2px 2px 0 var(--ink);
transition: transform 0.1s, box-shadow 0.1s;
}
.tile-card:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
.tile-dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; }
.tile-emoji { font-size: 1.7rem; }
.tile-name {
font-family: 'Nunito', sans-serif;
font-weight: 800;
font-size: 0.68rem;
line-height: 1.25;
margin-top: 5px;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}

.group-section { margin-bottom: 1.75rem; }
.group-header { display: flex; align-items: center; gap: 8px; margin-bottom: 0.75rem; }
.group-icon { font-size: 1.3rem; }
.group-name { font-family: 'Fredoka One', cursive; font-size: 1.05rem; }
.group-count {
background: var(--coral);
color: #fff;
font-weight: 800;
font-size: 0.7rem;
padding: 2px 9px;
border-radius: 20px;
border: 2px solid var(--ink);
}

.modal-overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(26,26,46,0.55);
z-index: 200;
align-items: center;
justify-content: center;
padding: 1rem;
}
.modal-overlay.open { display: flex; }
.modal {
background: var(--card-bg);
border: 3px solid var(--ink);
border-radius: 24px;
width: 100%;
max-width: 600px;
max-height: 90vh;
overflow-y: auto;
box-shadow: 8px 8px 0 var(--ink);
position: relative;
animation: popIn 0.2s ease;
}
@keyframes popIn {
from { transform: scale(0.9); opacity: 0; }
to { transform: scale(1); opacity: 1; }
}
.modal-header {
padding: 1.5rem 1.5rem 0;
display: flex;
align-items: flex-start;
gap: 1rem;
}
.modal-emoji { font-size: 3.5rem; }
.modal-title-wrap { flex: 1; }
.modal-title {
font-family: 'Fredoka One', cursive;
font-size: 1.7rem;
color: var(--ink);
line-height: 1.2;
}
.modal-close {
background: var(--coral);
border: 2.5px solid var(--ink);
border-radius: 50%;
width: 36px;
height: 36px;
font-size: 1.1rem;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-weight: 800;
flex-shrink: 0;
transition: transform 0.1s;
}
.modal-close:hover { transform: scale(1.1); }
.modal-body { padding: 1rem 1.5rem 1.5rem; }
.modal-meta {
display: flex;
gap: 10px;
flex-wrap: wrap;
margin: 0.75rem 0;
}
.modal-pill {
display: inline-flex;
align-items: center;
gap: 5px;
font-size: 0.8rem;
font-weight: 700;
padding: 5px 12px;
border-radius: 20px;
border: 2px solid var(--ink);
}
.modal-section-title {
font-family: 'Fredoka One', cursive;
font-size: 1.1rem;
margin: 1.1rem 0 0.5rem;
color: var(--ink);
}
.ingredient-list {
list-style: none;
display: flex;
flex-direction: column;
gap: 5px;
}
.ingredient-list li {
display: flex;
align-items: center;
gap: 8px;
font-size: 0.9rem;
font-weight: 600;
}
.ingredient-list li::before {
content: '';
width: 10px;
height: 10px;
border-radius: 50%;
border: 2px solid var(--ink);
background: var(--yellow);
flex-shrink: 0;
}
.steps-list {
list-style: none;
display: flex;
flex-direction: column;
gap: 10px;
}
.steps-list li {
display: flex;
gap: 12px;
font-size: 0.9rem;
font-weight: 600;
line-height: 1.6;
}
.step-num {
background: var(--coral);
color: #fff;
border: 2px solid var(--ink);
border-radius: 50%;
width: 26px;
height: 26px;
display: flex;
align-items: center;
justify-content: center;
font-size: 0.75rem;
font-weight: 800;
flex-shrink: 0;
margin-top: 2px;
}
.modal-note {
margin-top: 1rem;
background: var(--yellow);
border: 2px solid var(--ink);
border-radius: 12px;
padding: 0.75rem 1rem;
font-size: 0.85rem;
font-weight: 600;
line-height: 1.6;
}
.modal-note::before { content: '💡 '; }

.form-group { margin-bottom: 1rem; }
.form-label {
display: block;
font-weight: 800;
font-size: 0.85rem;
margin-bottom: 5px;
color: var(--ink);
}
.form-input, .form-select, .form-textarea {
width: 100%;
border: 2.5px solid var(--ink);
border-radius: 12px;
padding: 9px 14px;
font-family: 'Nunito', sans-serif;
font-size: 0.9rem;
font-weight: 600;
background: #fff;
color: var(--ink);
outline: none;
transition: box-shadow 0.15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
box-shadow: 3px 3px 0 var(--ink);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.empty-state {
text-align: center;
padding: 3rem 1rem;
display: none;
}
.empty-state.show { display: block; }
.empty-emoji { font-size: 4rem; margin-bottom: 1rem; }
.empty-text { font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: var(--ink); }

footer {
border-top: 2.5px solid var(--ink);
background: var(--mint);
padding: 1.5rem 2rem;
text-align: center;
font-weight: 700;
font-size: 0.85rem;
color: var(--ink);
}

@media (max-width: 600px) {
.form-row { grid-template-columns: 1fr; }
header { padding: 1.5rem; }
main { padding: 1.25rem; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-title">My Recipe<br><span>Book</span> 🍳</div>
    <div class="header-sub">Ibu's classics · web finds · TikTok hits · my own creations</div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="openAddModal()">＋ Add Recipe</button>
      <button class="btn btn-secondary" onclick="exportBook()">💾 Save / Export</button>
      <a class="btn btn-secondary" href="confinement.html">🤱 Confinement</a>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search recipes..." oninput="renderRecipes()">
    </div>
    <div class="filter-chips">
      <button class="chip active" data-filter="all" onclick="setFilter('all',this)">All</button>
      <button class="chip" data-filter="mum" onclick="setFilter('mum',this)">👩‍🍳 Ibu</button>
      <button class="chip" data-filter="web" onclick="setFilter('web',this)">🌐 Web</button>
      <button class="chip" data-filter="tiktok" onclick="setFilter('tiktok',this)">📱 TikTok</button>
      <button class="chip" data-filter="own" onclick="setFilter('own',this)">✨ My Own</button>
      <button class="chip" data-filter="fav" onclick="setFilter('fav',this)">❤️ Faves</button>
      <button class="chip" data-filter="confinement" onclick="setFilter('confinement',this)">🤱 Confinement</button>
    </div>
  </div>
  <div class="toolbar-inner" style="margin-top:10px;">
    <div class="filter-chips">
      <span class="view-label">View:</span>
      <button class="chip view-chip active" data-view="cards" onclick="setView('cards',this)">🗂 Cards</button>
      <button class="chip view-chip" data-view="rows" onclick="setView('rows',this)">☰ Rows</button>
      <button class="chip view-chip" data-view="tiles" onclick="setView('tiles',this)">▦ Tiles</button>
    </div>
    <div class="filter-chips">
      <button class="chip" id="groupToggle" onclick="toggleGroup(this)">📂 Group by Category</button>
    </div>
  </div>
</div>

<main>
  <div class="section-header">
    <div class="section-title">All Recipes</div>
    <div class="count-badge" id="countBadge">0</div>
  </div>
  <div class="recipe-grid" id="recipeGrid"></div>
  <div class="empty-state" id="emptyState">
    <div class="empty-emoji">🥺</div>
    <div class="empty-text">No recipes found!</div>
    <p style="margin-top:0.5rem; font-weight:600; color:#777;">Try a different search or filter</p>
  </div>
</main>

<footer>Made with ❤️ · My personal recipe collection · Add, save, share!</footer>

<div class="modal-overlay" id="viewModal" onclick="closeViewModal(event)">
  <div class="modal" id="viewModalContent"></div>
</div>

<div class="modal-overlay" id="addModal" onclick="closeAddModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <div class="modal-title" id="formTitle">Add New Recipe ✨</div>
      </div>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Recipe name *</label>
          <input class="form-input" id="f-name" placeholder="e.g. Ibu's Laksa">
        </div>
        <div class="form-group">
          <label class="form-label">Emoji icon</label>
          <input class="form-input" id="f-emoji" placeholder="🍜" maxlength="4">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Source</label>
          <select class="form-select" id="f-source">
            <option value="own">✨ My Own</option>
            <option value="mum">👩‍🍳 From Mum</option>
            <option value="web">🌐 From Website</option>
            <option value="tiktok">📱 From TikTok</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Category / cuisine</label>
          <input class="form-input" id="f-category" placeholder="e.g. Noodles, Dessert">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Cook time</label>
          <input class="form-input" id="f-time" placeholder="e.g. 30 mins">
        </div>
        <div class="form-group">
          <label class="form-label">Servings</label>
          <input class="form-input" id="f-servings" placeholder="e.g. 4">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Tags (comma-separated)</label>
        <input class="form-input" id="f-tags" placeholder="e.g. Spicy, Vegetarian, Quick">
      </div>
      <div class="form-group">
        <label class="form-label">Ingredients (one per line)</label>
        <textarea class="form-textarea" id="f-ingredients" placeholder="2 tbsp cooking oil&#10;1 onion, diced&#10;3 cloves garlic"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Steps (one per line)</label>
        <textarea class="form-textarea" id="f-steps" rows="5" placeholder="Heat oil in a pan&#10;Fry onion until golden&#10;Add garlic and stir"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Notes / tips (optional)</label>
        <textarea class="form-textarea" id="f-notes" rows="2" placeholder="Any special tips or variations..."></textarea>
      </div>
      <div style="display:flex; gap:10px; margin-top:1rem;">
        <button class="btn btn-primary" style="flex:1;" onclick="saveRecipe()">💾 Save Recipe</button>
        <button class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
const SOURCE_LABELS = { mum:'👩‍🍳 Ibu', web:'🌐 Website', tiktok:'📱 TikTok', own:'✨ My Own' };
const SOURCE_CLASS  = { mum:'source-mum', web:'source-web', tiktok:'source-tiktok', own:'source-own' };
const TAG_COLORS    = ['#ffe066','#ffb3c6','#b5ead7','#a0d8ef','#c9b8f5','#ffbe76'];

let currentFilter = 'all';
let editingId = null;
let currentView = 'cards';       // 'cards' | 'rows' | 'tiles'
let groupByCategory = false;

const GROUPS = [
  { key: 'meat',    name: 'Meat',                icon: '🍖' },
  { key: 'seafood', name: 'Seafood',              icon: '🦐' },
  { key: 'vege',    name: 'Vegetables',           icon: '🥬' },
  { key: 'rice',    name: 'Rice & Noodles',       icon: '🍚' },
  { key: 'bread',   name: 'Bread & Snacks',       icon: '🥯' },
  { key: 'drinks',  name: 'Drinks',                icon: '🧋' },
  { key: 'dessert', name: 'Desserts',              icon: '🍮' },
  { key: 'sauce',   name: 'Sauces & Condiments',   icon: '🌶️' },
  { key: 'other',   name: 'Other',                 icon: '🍽️' },
];
// Checked in this order — first match wins (e.g. a beef dumpling files under
// Meat, not Bread & Snacks; a fish soup files under Seafood, not Sauces).
const GROUP_KEYWORDS = [
  ['dessert', ['dessert','cake','bubur','lava','pudding','kuih']],
  ['drinks',  ['drink','tea','teh']],
  ['sauce',   ['sambal','sos','condiment','sauce']],
  ['seafood', ['seafood','ikan','fish','udang','prawn','shrimp','ketam','crab','sotong','squid','siput','siakap','pla']],
  ['meat',    ['beef','chicken','ayam','daging','pork','babi','kambing','lamb','turkey','duck','sausage','gai']],
  ['vege',    ['vegetarian','sayur','vegetable','tofu','tauhu','lentil','kacang']],
  ['bread',   ['bread','bagel','dumpling','snack','toast','pastry']],
  ['rice',    ['rice','nasi','noodle','mee','bihun','pasta','briyani']],
];

// Recipes don't have an explicit "meat/seafood/vege" field, so this infers a
// group from the name, category and tags already on each recipe — meaning any
// recipe you add later gets grouped automatically too. Set `r.group` on a
// recipe directly if you ever need to override the guess.
function inferGroup(r) {
  if (r.group) return r.group;
  const text = [r.category, r.name, ...(r.tags || [])].join(' ').toLowerCase();
  for (const [key, words] of GROUP_KEYWORDS) {
    if (words.some(w => text.includes(w))) return key;
  }
  return 'other';
}

const STORAGE_KEY = 'myRecipeBook_v3';

function loadRecipes() {
  try {
    const d = localStorage.getItem(STORAGE_KEY);
    return d ? JSON.parse(d) : null;
  } catch(e) { return null; }
}
function saveRecipes() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
}

let recipes = loadRecipes() || [
  {
    id: 32,
    name: "Asam Pedas",
    emoji: "🐟",
    source: "mum",
    category: "Masakan Melayu",

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-chips .chip:not(.view-chip):not(#groupToggle)').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderRecipes();
}

function setView(v, el) {
  currentView = v;
  document.querySelectorAll('.view-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderRecipes();
}

function toggleGroup(el) {
  groupByCategory = !groupByCategory;
  el.classList.toggle('active', groupByCategory);
  renderRecipes();
}

function fullCardHtml(r) {
  const tagHtml = r.tags.slice(0,3).map((t,i) =>
    `<span class="card-tag" style="background:${TAG_COLORS[i%TAG_COLORS.length]}">${t}</span>`
  ).join('');
  return `
    <div class="recipe-card" onclick="openViewModal(${r.id})">
      <div class="card-emoji-wrap">
        <span>${r.emoji || '🍽️'}</span>
        <span class="card-source-badge ${SOURCE_CLASS[r.source]}">${SOURCE_LABELS[r.source]}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${r.name}</div>
        <div style="font-size:0.78rem;font-weight:600;color:#777;">${r.category}</div>
        <div class="card-tags">${tagHtml}</div>
        <div class="card-meta">
          ${r.time ? `<span>⏱ ${r.time}</span>` : ''}
          ${r.servings ? `<span>🍽 ${r.servings}</span>` : ''}
        </div>
      </div>
      <div class="card-fav" onclick="toggleFav(event,${r.id})">${r.fav ? '❤️' : '🤍'}</div>
    </div>`;
}

function rowCardHtml(r) {
  return `
    <div class="row-card" onclick="openViewModal(${r.id})">
      <span class="row-emoji">${r.emoji || '🍽️'}</span>
      <span class="row-name">${r.name}</span>
      <div class="dot ${SOURCE_CLASS[r.source]}"></div>
    </div>`;
}

function tileCardHtml(r) {
  return `
    <div class="tile-card" onclick="openViewModal(${r.id})">
      <div class="dot tile-dot ${SOURCE_CLASS[r.source]}"></div>
      <div class="tile-emoji">${r.emoji || '🍽️'}</div>
      <div class="tile-name">${r.name}</div>
    </div>`;
}

function cardHtmlFor(r) {
  if (currentView === 'rows') return rowCardHtml(r);
  if (currentView === 'tiles') return tileCardHtml(r);
  return fullCardHtml(r);
}

function gridClass() {
  return 'recipe-grid' + (currentView === 'rows' ? ' view-rows' : currentView === 'tiles' ? ' view-tiles' : '');
}

function renderRecipes() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let filtered = recipes.filter(r => {
    const matchSearch = !q ||
      r.name.toLowerCase().includes(q) ||
      r.category.toLowerCase().includes(q) ||
      r.tags.some(t => t.toLowerCase().includes(q));
    const matchFilter =
      currentFilter === 'all' ? true :
      currentFilter === 'fav' ? r.fav :
      currentFilter === 'confinement' ? r.tags.some(t => t.toLowerCase() === 'confinement') :
      r.source === currentFilter;
    return matchSearch && matchFilter;
  });

  const grid = document.getElementById('recipeGrid');
  const empty = document.getElementById('emptyState');
  document.getElementById('countBadge').textContent = filtered.length;

  if (!filtered.length) {
    grid.className = '';
    grid.innerHTML = '';
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');

  if (!groupByCategory) {
    grid.className = gridClass();
    grid.innerHTML = filtered.map(cardHtmlFor).join('');
    return;
  }

  grid.className = '';
  grid.innerHTML = GROUPS.map(g => {
    const items = filtered.filter(r => inferGroup(r) === g.key);
    if (!items.length) return '';
    return `
      <div class="group-section">
        <div class="group-header">
          <span class="group-icon">${g.icon}</span>
          <span class="group-name">${g.name}</span>
          <span class="group-count">${items.length}</span>
        </div>
        <div class="${gridClass()}">${items.map(cardHtmlFor).join('')}</div>
      </div>`;
  }).join('');
}

function toggleFav(e, id) {
  e.stopPropagation();
  const r = recipes.find(x => x.id === id);
  if (r) { r.fav = !r.fav; saveRecipes(); renderRecipes(); }
}

function openViewModal(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  const ingHtml = r.ingredients.map(i => `<li>${i}</li>`).join('');
  const stepsHtml = r.steps.map((s,i) =>
    `<li><div class="step-num">${i+1}</div><div>${s}</div></li>`
  ).join('');
  const tagsHtml = r.tags.map((t,i) =>
    `<span class="modal-pill" style="background:${TAG_COLORS[i%TAG_COLORS.length]}">${t}</span>`
  ).join('');

  document.getElementById('viewModalContent').innerHTML = `
    <div class="modal-header">
      <div class="modal-emoji">${r.emoji || '🍽️'}</div>
      <div class="modal-title-wrap">
        <div class="modal-title">${r.name}</div>
        <span class="card-source-badge ${SOURCE_CLASS[r.source]}" style="position:static;display:inline-block;margin-top:6px;">${SOURCE_LABELS[r.source]}</span>
      </div>
      <button class="modal-close" onclick="closeViewModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-meta">
        ${r.time ? `<span class="modal-pill" style="background:var(--yellow)">⏱ ${r.time}</span>` : ''}
        ${r.servings ? `<span class="modal-pill" style="background:var(--mint)">🍽 ${r.servings}</span>` : ''}
        ${tagsHtml}
      </div>
      <div class="modal-section-title">🛒 Ingredients</div>
      <ul class="ingredient-list">${ingHtml}</ul>
      <div class="modal-section-title">👨‍🍳 Steps</div>
      <ol class="steps-list">${stepsHtml}</ol>
      ${r.notes ? `<div class="modal-note">${r.notes}</div>` : ''}
      <div style="display:flex;gap:8px;margin-top:1.25rem;">
        <button class="btn btn-secondary" style="font-size:0.8rem;padding:8px 14px;" onclick="editRecipe(${r.id})">✏️ Edit</button>
        <button class="btn" style="font-size:0.8rem;padding:8px 14px;background:var(--coral);color:#fff;border-color:var(--ink);" onclick="deleteRecipe(${r.id})">🗑 Delete</button>
      </div>
    </div>`;
  document.getElementById('viewModal').classList.add('open');
}

function closeViewModal(e) {
  if (!e || e.target === document.getElementById('viewModal'))
    document.getElementById('viewModal').classList.remove('open');
}

function openAddModal() {
  editingId = null;
  document.getElementById('formTitle').textContent = 'Add New Recipe ✨';
  ['name','emoji','category','time','servings','tags','ingredients','steps','notes'].forEach(f => {
    document.getElementById('f-'+f).value = '';
  });
  document.getElementById('f-source').value = 'own';
  document.getElementById('addModal').classList.add('open');
}

function closeAddModal(e) {
  if (!e || e.target === document.getElementById('addModal'))
    document.getElementById('addModal').classList.remove('open');
}

function editRecipe(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  document.getElementById('formTitle').textContent = 'Edit Recipe ✏️';
  document.getElementById('f-name').value = r.name;
  document.getElementById('f-emoji').value = r.emoji || '';
  document.getElementById('f-source').value = r.source;
  document.getElementById('f-category').value = r.category;
  document.getElementById('f-time').value = r.time;
  document.getElementById('f-servings').value = r.servings;
  document.getElementById('f-tags').value = r.tags.join(', ');
  document.getElementById('f-ingredients').value = r.ingredients.join('\n');
  document.getElementById('f-steps').value = r.steps.join('\n');
  document.getElementById('f-notes').value = r.notes || '';
  document.getElementById('viewModal').classList.remove('open');
  document.getElementById('addModal').classList.add('open');
}

function saveRecipe() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Please enter a recipe name!'); return; }
  const data = {
    name,
    emoji: document.getElementById('f-emoji').value.trim() || '🍽️',
    source: document.getElementById('f-source').value,
    category: document.getElementById('f-category').value.trim() || 'General',
    time: document.getElementById('f-time').value.trim(),
    servings: document.getElementById('f-servings').value.trim(),
    tags: document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    ingredients: document.getElementById('f-ingredients').value.split('\n').map(t=>t.trim()).filter(Boolean),
    steps: document.getElementById('f-steps').value.split('\n').map(t=>t.trim()).filter(Boolean),
    notes: document.getElementById('f-notes').value.trim(),
    fav: false
  };
  if (editingId) {
    const idx = recipes.findIndex(x => x.id === editingId);
    data.id = editingId;
    data.fav = recipes[idx].fav;
    recipes[idx] = data;
  } else {
    data.id = Date.now();
    recipes.unshift(data);
  }
  saveRecipes();
  closeAddModal();
  renderRecipes();
}

function deleteRecipe(id) {
  if (!confirm('Delete this recipe?')) return;
  recipes = recipes.filter(x => x.id !== id);
  saveRecipes();
  document.getElementById('viewModal').classList.remove('open');
  renderRecipes();
}

function exportBook() {
  const html = document.documentElement.outerHTML;
  const blob = new Blob([
    html.replace(
      /let recipes = loadRecipes\(\) \|\| \[[\s\S]*?\];/,
      `let recipes = loadRecipes() || ${JSON.stringify(recipes, null, 2)};`
    )
  ], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-recipe-book.html';
  a.click();
}

renderRecipes();
